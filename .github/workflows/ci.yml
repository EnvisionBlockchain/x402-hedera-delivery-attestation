name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: typecheck and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in package.json engines; 22 is what this is
        # developed against. Testing both keeps the engines claim honest.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No credentials, and nothing here spends testnet HBAR or needs a Hedera
      # account. Not fully offline though: mirror node access is mocked, but the
      # seller-gate tests reach the facilitator to build a 402, so this job
      # depends on that third party being up.
      - name: Test
        run: npm test

  hygiene:
    name: secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo previously committed a funded testnet key as a test fixture.
      # It was scrubbed from history and fixtures now generate keys per run, so
      # this guard exists to keep it that way.
      - name: Fail if a DER private key is committed
        run: |
          if git grep -nIE '30(30|2e)0201003007?0[56]0[0-9a-f]{2}[0-9a-f]{40,}' \
               -- . ':!package-lock.json' ':!LICENSE'; then
            echo "::error::A DER-encoded private key appears in tracked files."
            exit 1
          fi
          echo "No committed key material."

      - name: Fail if .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked and must not be."
            exit 1
          fi
          echo ".env is not tracked."
